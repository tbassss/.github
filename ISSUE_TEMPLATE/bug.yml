name: Bug
description: Something isn't working right.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      placeholder: What did you do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: On what?
      options:
        - iPhone
        - Mac
        - Linux desktop
        - Somewhere else
    validations:
      required: false
  - type: markdown
    attributes:
      value: A screenshot helps. Leave out anything private.
